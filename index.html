const $=id=>document.getElementById(id),viewport=$('viewport'),world=$('world'),stage=$('stage'),form=$('search'),input=$('fox-id'),dialog=$('detail');
const reduceMotion=window.matchMedia('(prefers-reduced-motion: reduce)');
let data,scale=1,zoom=1,selectedId=null,lastFocus=null,ready=false;
const elements=new Map();
function characterSource(id){return window.FOX_ASSETS?.[id]||`${data?.assetDirectory||'assets/foxes'}/${id}.webp`;}
function status(text,error=false){$('status').textContent=text;input.setAttribute('aria-invalid',String(error));}
function fit(){
 if(!data)return;
 const fittedSearchWidth=Math.min(viewport.clientWidth/data.width,(window.innerHeight-100)/data.height)*data.search.w;
 const compact=window.innerWidth<900||window.innerHeight<620||fittedSearchWidth<280;document.body.classList.toggle('compact-layout',compact);
 if(compact&&form.parentElement!==document.body)document.body.appendChild(form);else if(!compact&&form.parentElement!==stage)stage.appendChild(form);
 const base=Math.min(viewport.clientWidth/data.width,viewport.clientHeight/data.height);scale=base*zoom;
 const w=data.width*scale,h=data.height*scale;world.style.width=Math.max(w,viewport.clientWidth)+'px';world.style.height=Math.max(h,viewport.clientHeight)+'px';
 stage.style.width=w+'px';stage.style.height=h+'px';stage.style.transform='none';stage.style.left=Math.max(0,(viewport.clientWidth-w)/2)+'px';stage.style.top=Math.max(0,(viewport.clientHeight-h)/2)+'px';
 for(const c of data.characters){const el=elements.get(c.id);if(el){el.style.left=c.x*scale+'px';el.style.top=c.y*scale+'px';el.style.width=c.w*scale+'px';el.style.height=c.h*scale+'px';}}
 const b=data.search;
 if(!compact){form.style.left=b.x*scale+'px';form.style.top=b.y*scale+'px';form.style.width=b.w*scale+'px';form.style.height=Math.max(b.h*scale,44)+'px';}else{form.style.left='';form.style.top='';form.style.width='';form.style.height='';}
 $('zoom-out').disabled=zoom<=1;$('zoom-in').disabled=zoom>=4;
}
function centerOn(c,behavior='smooth'){
 const rect=elements.get(c.id).getBoundingClientRect(),view=viewport.getBoundingClientRect();
 viewport.scrollTo({left:viewport.scrollLeft+rect.left-view.left+rect.width/2-view.width/2,top:viewport.scrollTop+rect.top-view.top+rect.height/2-view.height/2,behavior:reduceMotion.matches?'instant':behavior});
}
function changeZoom(value){
 const old=scale,cx=(viewport.scrollLeft+viewport.clientWidth/2)/old,cy=(viewport.scrollTop+viewport.clientHeight/2)/old;
 zoom=Math.max(1,Math.min(4,value));fit();
 if(selectedId)centerOn(data.characters.find(c=>c.id===selectedId),'instant');else viewport.scrollTo({left:cx*scale-viewport.clientWidth/2,top:cy*scale-viewport.clientHeight/2,behavior:'instant'});
}
function clearSelection(){selectedId=null;stage.classList.remove('has-target');elements.forEach(el=>{el.classList.remove('is-target');el.removeAttribute('aria-current');});input.value='';$('clear-search').hidden=true;status('');}
function locate(raw){
 const value=String(raw).trim().replace(/^#\s*/,'');
 if(!/^\d{1,3}$/.test(value)){status('请输入 1–3 位角色编号',true);return {found:false,reason:'invalid_id'};}
 const id=value.padStart(3,'0'),target=elements.get(id);
 if(!target){status(`没有找到 #${id}`,true);return {found:false,id,reason:'not_found'};}
 selectedId=id;input.value=id;$('clear-search').hidden=false;stage.classList.add('has-target');
 elements.forEach((el,key)=>{el.classList.toggle('is-target',key===id);if(key===id)el.setAttribute('aria-current','true');else el.removeAttribute('aria-current');});
 centerOn(data.characters.find(c=>c.id===id));target.focus({preventScroll:true});status(`已定位 #${id} · 点击查看大图`);return {found:true,id};
}
function openCharacter(id){
 const c=data.characters.find(c=>c.id===id);if(!c)return {opened:false,id};
 lastFocus=elements.get(id);$('detail-title').textContent='#'+id;$('detail-image').src=characterSource(id);$('detail-image').alt='狐狸 '+id;
 $('github-folder').href='https://github.com/Next-DAO/meta-foxes-3d-models/tree/main/'+encodeURIComponent(c.id);
 $('github-folder').setAttribute('aria-label','在新标签页打开 #'+c.id+' 的 GitHub 文件夹');
 $('github-folder-label').textContent='GitHub · #'+c.id;
 if(!dialog.open)dialog.showModal();return {opened:true,id};
}
function moveFocus(c,key){
 const horizontal=key==='ArrowLeft'||key==='ArrowRight',sign=key==='ArrowLeft'||key==='ArrowUp'?-1:1;
 const candidates=data.characters.filter(p=>sign*((horizontal?p.x:p.y)-(horizontal?c.x:c.y))>30);
 candidates.sort((a,b)=>{const score=p=>Math.abs((horizontal?p.x:p.y)-(horizontal?c.x:c.y))+Math.abs((horizontal?p.y:p.x)-(horizontal?c.y:c.x))*3;return score(a)-score(b);});
 if(candidates[0])elements.get(candidates[0].id).focus();
}
function registerTools(){
 const context=document.modelContext;if(!context?.registerTool)return;const lifecycle=new AbortController();
 const tools=[
  {name:'locate_metafox',title:'定位狐狸',description:'按原始编号在合影中高亮并定位一只狐狸，不打开详情。',inputSchema:{type:'object',properties:{id:{type:'string',description:'一至三位编号，例如 7 或 007'}},required:['id'],additionalProperties:false},execute:async args=>{if(!args||typeof args.id!=='string')throw Error('id must be a string');const result=locate(args.id);await new Promise(requestAnimationFrame);return result;}},
  {name:'open_metafox',title:'查看狐狸大图',description:'打开指定狐狸编号的详情大图。',inputSchema:{type:'object',properties:{id:{type:'string'}},required:['id'],additionalProperties:false},execute:async args=>{if(!args||typeof args.id!=='string'||!/^\d{1,3}$/.test(args.id.trim()))throw Error('Invalid character ID');const result=openCharacter(args.id.trim().padStart(3,'0'));await new Promise(requestAnimationFrame);return result;}}
 ];
 for(const tool of tools)try{Promise.resolve(context.registerTool({...tool,annotations:{readOnlyHint:false,untrustedContentHint:false}},{signal:lifecycle.signal})).catch(()=>{});}catch{}
 window.addEventListener('pagehide',()=>lifecycle.abort(),{once:true});
}
async function start(){
 data=window.FOX_DATA||await fetch('foxes.json').then(r=>{if(!r.ok)throw Error('Could not load characters');return r.json();});
 const frag=document.createDocumentFragment();
 for(const c of data.characters){
  const el=document.createElement('button');el.type='button';el.className='fox';el.id='fox-'+c.id;el.dataset.id=c.id;el.setAttribute('aria-label','查看狐狸 '+c.id);el.style.cssText=`left:${c.x}px;top:${c.y}px;width:${c.w}px;height:${c.h}px;--angle:${c.rotation}deg;z-index:${Math.round(c.y)}`;
  const img=document.createElement('img');img.src=characterSource(c.id);img.alt='狐狸 '+c.id;img.draggable=false;img.decoding='async';
  const label=document.createElement('span');label.className='number';label.textContent='#'+c.id;el.append(img,label);el.addEventListener('click',()=>openCharacter(c.id));el.addEventListener('keydown',event=>{if(event.key.startsWith('Arrow')){event.preventDefault();moveFocus(c,event.key);}});elements.set(c.id,el);frag.appendChild(el);
 }
 stage.appendChild(frag);zoom=window.innerWidth<640?Math.min(4,1100/viewport.clientWidth):1;fit();ready=true;
 if(zoom>1){viewport.scrollLeft=(world.offsetWidth-viewport.clientWidth)/2;viewport.scrollTop=(world.offsetHeight-viewport.clientHeight)/2;}
 form.addEventListener('submit',e=>{e.preventDefault();locate(input.value);});$('clear-search').addEventListener('click',()=>{clearSelection();input.focus();});
 $('zoom-in').addEventListener('click',()=>changeZoom(zoom+.35));$('zoom-out').addEventListener('click',()=>changeZoom(zoom-.35));$('reset-view').addEventListener('click',()=>changeZoom(1));
 $('close-detail').addEventListener('click',()=>dialog.close());dialog.addEventListener('click',e=>{if(e.target===dialog){const r=dialog.getBoundingClientRect();if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom)dialog.close();}});dialog.addEventListener('close',()=>lastFocus?.focus({preventScroll:true}));
 window.addEventListener('keydown',e=>{if(e.key==='Escape'&&!dialog.open&&selectedId)clearSelection();});registerTools();
}
window.addEventListener('resize',()=>{if(ready)fit();});
start().catch(()=>status('加载失败，请刷新重试',true));
